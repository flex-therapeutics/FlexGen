[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flexgen-sampler"
version = "1.0.0"
description = "Protein conformational sampling with FlexGen"
requires-python = ">=3.12"
dependencies = ["torch>=2.3", "numpy", "scipy", "mdtraj", "biopython", "omegaconf", "einops", "opt-einsum", "pandas", "tqdm", "biotite", "torch-scatter", "loguru", "jaxtyping", "ml-collections", "dm-tree"]

[project.scripts]
flexgen = "flexgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "*.pt", "*_LICENSE", "resources/*", "data/*.pt"]
